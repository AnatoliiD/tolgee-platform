ext {
    dockerPath = buildDir.absolutePath + "/docker"
}

tasks.register('dockerPrepare') {
    doLast {
        delete(dockerPath)
        copy {
            from(tasks.unpack.outputs, 'docker/app')
            into(dockerPath)
        }

        copy {
            from("${projectDir.absolutePath}/docker/app")
            into(dockerPath)
        }
    }
    dependsOn("unpack", "copyDist", "copyDockerIgnore", "addVersionFile")
}

// Builds Docker image for local development.
// Single platform, no push, tagged as tolgee/tolgee.
tasks.register('docker', Exec) {
    dependsOn("dockerPrepare")
    workingDir dockerPath
    commandLine "docker", "build", ".",
        "-t", "tolgee/tolgee",
        "--build-arg", "OTEL_AGENT_VERSION=${opentelemetryJavaagentVersion}"
}

// Builds the slim Docker image, tagged as tolgee/tolgee:slim.
// Uses Dockerfile.slim - JRE-only base, no embedded postgres.
// The slim image is not published; it is built on demand by the EE image
// build in the billing repo and by the slim smoke test.
tasks.register('dockerSlim', Exec) {
    dependsOn("dockerPrepare")
    workingDir dockerPath
    commandLine "docker", "build", ".",
        "-f", "Dockerfile.slim",
        "-t", "tolgee/tolgee:slim",
        "--build-arg", "OTEL_AGENT_VERSION=${opentelemetryJavaagentVersion}"
}

// Builds and pushes multi-platform Docker image for CI.
// Reads configuration from environment variables:
//   - VERSION: image tag version (default: 'latest')
//   - DOCKER_IMAGE: image name (default: 'tolgee/tolgee')
//   - DOCKER_CACHE_FROM: cache source (optional, e.g., 'type=registry,ref=tolgee/tolgee:latest')
//   - DOCKER_CACHE_TO: cache destination (optional, e.g., 'type=inline')
// Requires: docker buildx create --use (run once before calling this task)
tasks.register('dockerPublish', Exec) {
    dependsOn("dockerPrepare")
    workingDir dockerPath

    def version = System.getenv('VERSION') ?: 'latest'
    def imageName = System.getenv('DOCKER_IMAGE') ?: 'tolgee/tolgee'
    def tag = "${imageName}:${version}"
    def cacheFrom = System.getenv('DOCKER_CACHE_FROM')
    def cacheTo = System.getenv('DOCKER_CACHE_TO')

    def commandParams = ["docker", "buildx", "build", ".",
        "-t", tag,
        "--build-arg", "OTEL_AGENT_VERSION=${opentelemetryJavaagentVersion}",
        "--platform", "linux/arm64,linux/amd64",
        "--push"]

    if (cacheFrom) {
        commandParams += ["--cache-from", cacheFrom]
    }
    if (cacheTo) {
        commandParams += ["--cache-to", cacheTo]
    }

    commandLine commandParams
}

tasks.register('cleanDocker') {
    doLast {
        delete(dockerPath)
    }
}

tasks.register('copyDockerIgnore', Copy) {
    from "docker/app/.dockerignore"
    into "build/docker"
}

// Builds the OSS Docker image from source inside Docker. The host only runs Gradle; compilation
// (JDK 25, Node) happens in the image. Uses docker/app/Dockerfile.build with the repository root
// as the build context; Dockerfile.build.dockerignore keeps the EE sources out of it.
// Pass -PdockerImageTag=... to override the tag, -PdockerPush=true to build multi-platform and push.
tasks.register('dockerFromSourceOss', Exec) {
    workingDir projectDir

    def tag = project.findProperty('dockerImageTag') ?: 'tolgee/tolgee-oss'
    def push = project.findProperty('dockerPush') == 'true'
    def commandParams = ["docker", "buildx", "build", ".",
        "-f", "docker/app/Dockerfile.build",
        "-t", tag,
        "--build-arg", "OTEL_AGENT_VERSION=${opentelemetryJavaagentVersion}",
        "--build-arg", "VERSION=${project.version}"]
    commandParams += push ? ["--platform", "linux/arm64,linux/amd64", "--push"] : ["--load"]

    commandLine commandParams
}
